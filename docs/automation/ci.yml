name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test core and MCP protocol
        run: python -m unittest discover -s tests -t . -v

  distributions:
    name: Web and Python package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install build and browser dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build Python distributions
        run: python -m build
      - name: Test Web model transport
        run: npm --prefix web test
      - name: Verify isolated Linux MCP installation
        env:
          SILICON_CANVAS_INSTALL_DIR: ${{ runner.temp }}/silicon-canvas-install
          PYTHON: python
        run: |
          wheels=(dist/*.whl)
          bash scripts/install-mcp.sh "${wheels[0]}"
          python scripts/verify_mcp_executable.py "$SILICON_CANVAS_INSTALL_DIR/venv/bin/silicon-canvas-mcp"
      - name: Build static Web
        run: python scripts/build_web.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify browser and native compilation
        run: python scripts/verify_browser.py
      - name: Archive the verified static site
        run: python -c "import shutil; shutil.make_archive('dist/silicon-canvas-web', 'zip', 'dist/web')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silicon-canvas-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silicon-canvas-web
          path: dist/silicon-canvas-web.zip
          if-no-files-found: error

  windows-mcp:
    name: Windows portable MCP
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_mcp.py
      - name: Verify portable MCP over real STDIO
        run: python scripts/verify_mcp_executable.py dist/portable/silicon-canvas-mcp/silicon-canvas-mcp.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: silicon-canvas-mcp-windows
          path: dist/silicon-canvas-mcp-windows-x64.zip
          if-no-files-found: error
